version: '3.8'

services:
  # PostgreSQL 测试数据库
  postgres:
    image: postgres:15-alpine
    container_name: dbdata-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # 映射到 5433 端口，与测试配置匹配
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - dbdata-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

  # MySQL 测试数据库（可选）
  mysql:
    image: mysql:8.0
    container_name: dbdata-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: mysql123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    networks:
      - dbdata-test-network
    command: 
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--max-connections=200"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MariaDB 测试数据库（可选）
  mariadb:
    image: mariadb:10.11
    container_name: dbdata-mariadb-test
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: mariadbuser
      MYSQL_PASSWORD: mariadb123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mariadb_test_data:/var/lib/mysql
    networks:
      - dbdata-test-network
    command: 
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--max-connections=200"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SQLite 使用文件，无需容器

volumes:
  postgres_test_data:
    driver: local
  mysql_test_data:
    driver: local
  mariadb_test_data:
    driver: local

networks:
  dbdata-test-network:
    driver: bridge
