server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug" # debug/release

database:
  max_connections: 10
  connection_timeout: 30s
  idle_timeout: 5m

generator:
  default_batch_size: 500
  default_thread_count: 4
  max_thread_count: 20
  use_transaction: true

log:
  level: "info" # debug/info/warn/error
  output: "stdout" # stdout/file
  file_path: "logs/app.log"

